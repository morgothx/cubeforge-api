name: cubeforge

services:
  # Local AWS emulator (floci.io). Never a real AWS account — see CLAUDE.md.
  # The Docker socket is required because Lambda and other stateful services
  # are backed by real containers that Floci spawns itself.
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
    environment:
      FLOCI_HOSTNAME: floci
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_STORAGE_MODE: persistent
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/4566 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # OLTP store. Analytical queries never run here — they go to Athena.
  postgres:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cubeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cubeforge}
      POSTGRES_DB: ${POSTGRES_DB:-cubeforge}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cubeforge} -d ${POSTGRES_DB:-cubeforge}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Semantic layer. Long-lived by design (persistent pre-aggregation cache),
  # which is why it is not deployed to Lambda.
  #
  # It reads the exported objects through the analytical engine and **not** the
  # transactional store. The PostgreSQL source it used to carry predated the
  # export pipeline and contradicted the rule that pipeline exists to honour:
  # heavy analysis never touches the OLTP store.
  cube:
    image: cubejs/cube:latest
    ports:
      # Bound to the loopback address, not published to the network. The API
      # and the integration suite both run on the host, so a service publishing
      # nothing would be unreachable by the only two things entitled to reach
      # it. What keeps an unauthorized caller out is the signed context it
      # cannot mint and the development playground being off — not the absence
      # of a port. The SQL API is not published at all: nothing uses it.
      - "127.0.0.1:4000:4000"
    environment:
      # Off. The playground answers without a credential, which is exactly what
      # a caller the platform has not authorized must not get. It comes back
      # through docker-compose.playground.yml, deliberately and by name.
      CUBEJS_DEV_MODE: "false"
      CUBEJS_DB_TYPE: athena
      CUBEJS_DB_NAME: ${ANALYTICS_DATABASE:-cubeforge}
      CUBEJS_AWS_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      CUBEJS_AWS_KEY: ${AWS_ACCESS_KEY_ID:-test}
      CUBEJS_AWS_SECRET: ${AWS_SECRET_ACCESS_KEY:-test}
      CUBEJS_AWS_ATHENA_WORKGROUP: ${ANALYTICS_WORKGROUP:-primary}
      CUBEJS_AWS_S3_OUTPUT_LOCATION: ${ANALYTICS_RESULTS_LOCATION:-s3://cubeforge-analytics-results/}
      # Dialled from inside this network, where the emulator answers to its
      # service name — not the host endpoint the API and the scripts use. The
      # driver has no documented setting for this; cube/cube.js passes it.
      CUBE_ATHENA_ENDPOINT: ${CUBE_ATHENA_ENDPOINT:-http://floci:4566}
      # Read by both sides: the API signs a context with it, this verifies it.
      # Never AUTH_TOKEN_SECRET — see .env.example for why.
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-cube-dev-only-not-a-real-secret-change-me}
      CUBEJS_CUBESTORE_HOST: cubestore
      CUBEJS_CUBESTORE_PORT: "3030"
      # What actually builds and rebuilds the prepared answers.
      #
      # Without it Cube still *chooses* the rollup for a question and then
      # refuses, because nothing ever materialized a partition. Requirement 6.4
      # asks for a rebuild with nobody asking, and this is the thing that asks.
      CUBEJS_REFRESH_WORKER: "true"
    volumes:
      - ./cube:/cube/conf
    depends_on:
      floci:
        condition: service_healthy
      cubestore:
        condition: service_started

  # Where prepared answers are built and kept.
  #
  # An explicit service because dev mode is off, and dev mode is the only thing
  # that starts an embedded one. Without it the container starts and then
  # refuses every question before reaching the engine — the queue and the cache
  # both run on this, so its absence is not a slow path but no path at all.
  cubestore:
    image: cubejs/cubestore:latest
    volumes:
      - cube-store:/cube/data

volumes:
  floci-data:
  postgres-data:
  cube-store:
