cubes:
  # What a movement's `sku` names, labelled as the catalogue labels it today.
  #
  # The name is the exported catalogue's latest, so a renamed product relabels
  # its history. That is the behaviour the export chose; it is inherited here
  # rather than decided here.
  - name: products
    sql_table: products

    dimensions:
      - name: tenant_id
        sql: "{CUBE}.tenant_id"
        type: string

      # The code the movement carries as `sku`.
      # A primary key, and also a label the platform publishes.
      #
      # Cube hides primary-key dimensions unless told otherwise, so without
      # this a question grouped by product is refused: "You requested hidden
      # member". The key and the label are the same column here — the code is
      # what identifies a product and what a reader recognises it by.
      - name: code
        sql: "{CUBE}.code"
        type: string
        primary_key: true
        public: true

      - name: name
        sql: "{CUBE}.name"
        type: string

      - name: category
        sql: "{CUBE}.category"
        type: string
